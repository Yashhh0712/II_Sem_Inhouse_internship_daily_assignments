<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Form</title>
</head>
<body>
  <form>
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your name" />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" />

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" />

    <label for="city">City</label>
    <input type="text" id="city" name="city" placeholder="Enter your city" />

    <label for="profession">Profession</label>
    <input type="text" id="profession" name="profession" placeholder="Your profession" />

    <label for="skills">Skills</label>
    <input type="text" id="skills" name="skills" placeholder="HTML, CSS, JavaScript" />

    <label for="website">Website</label>
    <input type="url" id="website" name="website" placeholder="https://example.com" />

    <label for="experience">Experience</label>
    <input type="number" id="experience" name="experience" placeholder="Years of experience" />
  </form>
</body>
</html>
