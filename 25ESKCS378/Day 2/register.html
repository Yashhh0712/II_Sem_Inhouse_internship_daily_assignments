<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <div class="register">
        <h1>Student Registration</h1>
        <p class="subtitle">Fill in your details to create a new student profile.</p>

        <form id="registration-form">
            <div class="field-group">
                <label for="first-name">First Name</label>
                <input id="first-name" name="firstName" type="text" class="input-field" placeholder="John" required>
            </div>

            <div class="field-group">
                <label for="last-name">Last Name</label>
                <input id="last-name" name="lastName" type="text" class="input-field" placeholder="Doe" required>
            </div>

            <div class="field-group">
                <label for="email">Email Address</label>
                <input id="email" name="email" type="email" class="input-field" placeholder="john.doe@example.com" required>
            </div>

            <div class="field-group">
                <label for="phone">Phone Number</label>
                <input id="phone" name="phone" type="tel" class="input-field" placeholder="123-456-7890" required>
            </div>

            <div class="field-group gender-group">
                <span>Gender</span>
                <label><input type="radio" name="gender" value="male" required> Male</label>
                <label><input type="radio" name="gender" value="female"> Female</label>
                <label><input type="radio" name="gender" value="other"> Other</label>
            </div>

            <div class="field-group">
                <label for="dob">Date of Birth</label>
                <input id="dob" name="dob" type="date" class="input-field" required>
            </div>

            <button type="submit" class="primary-btn">Register</button>
            <div id="message" class="message"></div>
        </form>
    </div>

    <script src="register.js"></script>
</body>

</html>
